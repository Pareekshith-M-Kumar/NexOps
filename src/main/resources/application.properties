spring.datasource.url=jdbc:mysql://localhost:3306/nexops_db
spring.datasource.username=nexops_user
spring.datasource.password=nex@ops

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

nexops.ai.default-estimated-cost=0.01
nexops.ai.budget-warning-threshold=80
nexops.ai.default-max-output-tokens=200
nexops.ai.max-output-tokens=1000
nexops.ai.max-input-tokens=4000

nexops.ai.rate-limit.requests=10
nexops.ai.rate-limit.window-seconds=60
spring.data.redis.host=localhost
spring.data.redis.port=6379